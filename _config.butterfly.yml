# Butterfly 主题配置（精简版，完整选项见 themes/hexo-theme-butterfly 内文档）

# 导航栏
nav:
  logo: img/qigong.jpg
  display_title: true
  fixed: false

# 菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  GitHub: https://github.com/ko1vte || fab fa-github

# 头像与侧边栏信息
avatar:
  img: img/qigong.jpg
  effect: false

# 首页顶部横幅图
index_img: img/touhou.jpg

social:
  fab fa-github: https://github.com/ko1vte || Github

# 打字机副标题
# 注意：Butterfly 5.x 中 sub = 显示的文字列表；effect: true = 打字机动画
subtitle:
  enable: true
  loop: true
  effect: true
  sub:
    - 廊下で転ぶと鼻血が出て、
    - 人生で転ぶと、
    - 涙が出るんだ。
  typed_option:
    typeSpeed: 150
    backSpeed: 50
    startDelay: 300

# 页脚
footer:
  owner:
    enable: true
    since: 2023
  custom_text: © 2023 SU15VTE

# 文章元信息
post_meta:
  page:
    date_type: date
    date_format: YYYY-MM-DD
    categories: true
    tags: true

# 目录
toc:
  post: true
  page: true
  number: true
  style_simple: false
  scroll_percent: true

# 站点图标
favicon: img/qigong.jpg

# 暗色模式
darkmode:
  enable: true
  button: true

# 鼠标/页面特效
fireworks:
  enable: true
  zIndex: 9999
  mobile: false

click_heart:
  enable: false

# 自定义注入：网易云播放器 + Live2D 看板娘（全部本地托管，不依赖 CDN）
inject:
  head:
    - <link rel="stylesheet" href="/css/APlayer.min.css">
  bottom:
    - <script src="/js/APlayer.min.js"></script>
    - <script src="/js/Meting.min.js"></script>
    - <meting-js server="netease" type="playlist" id="7796421796" fixed="true" mini="true" autoplay="false" listFolded="false" order="random" preload="none" volume="0.7"></meting-js>
    - <script src="/js/L2Dwidget.min.js"></script>
    - <script src="/js/L2Dwidget.0.min.js"></script>
    - <script>L2Dwidget.init({model:{jsonPath:"/live2d/haru/02/assets/haru02.model.json"},display:{position:"right",width:150,height:300},mobile:{show:false},react:{opacity:0.7}});</script>

# CDN：全部改成本地托管（国内访问 jsdelivr 不稳定）
CDN:
  option:
    typed: /js/typed.umd.js
    fontawesome: /css/all.min.css
    fireworks: /js/fireworks.min.js
    egjs_infinitegrid: /js/infinitegrid.min.js
    sharejs: /js/social-share.min.js
    sharejs_css: /css/share.min.css

# 文章版权
post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0

# 代码块
code_word_wrap: false
highlight_theme: light

# 评论：关闭
comments:
  use: false

# 本地搜索：关闭（保持简单）
local_search:
  enable: false
