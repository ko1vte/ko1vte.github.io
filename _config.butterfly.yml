# Butterfly 主题配置（精简版，完整选项见 themes/hexo-theme-butterfly 内文档）

# 导航栏
nav:
  logo: img/qigong.jpg
  display_title: true
  fixed: false

# 菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  GitHub: https://github.com/ko1vte || fab fa-github

# 头像与侧边栏信息
avatar:
  img: img/qigong.jpg
  effect: false

# 首页顶部横幅图
index_img: img/touhou.jpg

social:
  fab fa-github: https://github.com/ko1vte || Github

# 打字机副标题
subtitle:
  enable: true
  loop: true
  effect: true
  typed_option: ["廊下で転ぶと鼻血が出て、", "人生で転ぶと、", "涙が出るんだ。"]
  sub:
    - 欢迎来到我的 Blog

# 页脚
footer:
  owner:
    enable: true
    since: 2023
  custom_text: © 2023 SU15VTE

# 文章元信息
post_meta:
  page:
    date_type: date
    date_format: YYYY-MM-DD
    categories: true
    tags: true

# 目录
toc:
  post: true
  page: true
  number: true
  style_simple: false
  scroll_percent: true

# 站点图标
favicon: img/qigong.jpg

# 暗色模式
darkmode:
  enable: true
  button: true

# 鼠标/页面特效
fireworks:
  enable: true
  zIndex: 9999
  mobile: false

click_heart:
  enable: false

# 自定义注入：网易云播放器 + Live2D 看板娘
inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
  bottom:
    - <script data-pjax src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
    - <script data-pjax src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>
    - <meting-js server="netease" type="playlist" id="7796421796" fixed="true" mini="true" autoplay="false" listFolded="false" order="random" preload="none" volume="0.7"></meting-js>
    - <script data-pjax src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
    - <script data-pjax>L2Dwidget.init({model:{jsonPath:"https://cdn.jsdelivr.net/npm/live2d-widget-model-haru@1.0.5/assets/haru.model.json"},display:{position:"right",width:150,height:300},mobile:{show:false},react:{opacity:0.7}});</script>

# 文章版权
post_copyright:
  enable: true
  license: CC BY-NC-SA 4.0

# 代码块
code_word_wrap: false
highlight_theme: light

# 评论：关闭
comments:
  use: false

# 本地搜索：关闭（保持简单）
local_search:
  enable: false
