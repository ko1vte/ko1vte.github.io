baseURL = "https://ko1vte.github.io/"
locale = "zh-cn"
title = "SU15VTE 的 Blog"
theme = "hugo-theme-stack"
enableEmoji = true
hasCJKLanguage = true
defaultContentLanguage = "zh-cn"

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[pagination]
  pagerSize = 6

[params]
  mainSections = ["post"]
  rssFullContent = true
  favicon = "img/qigong.jpg"

  [params.footer]
    since = 2023
    customText = "© 2023 SU15VTE"

  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02"

  [params.sidebar]
    compact = false
    avatar = "img/qigong.jpg"
    emoji = "🌸"
    subtitle = "廊下で転ぶと鼻血が出て、人生で転ぶと、涙が出るんだ。"

  [params.article]
    headingAnchor = false
    math = false
    toc = true
    readingTime = true

    [params.article.license]
      enabled = true
      default = "Licensed under CC BY-NC-SA 4.0"

  [params.comments]
    enabled = false

  [params.widgets]
    homepage = [{ type = "search" }, { type = "archives" }, { type = "tag-cloud" }]
    page = [{ type = "toc" }]

  [params.colorScheme]
    toggle = true
    default = "light"

  [params.opengraph.twitter]
    site = ""
    card = "summary"

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = -100
  params.icon = "home"

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = -90
  params.icon = "archives"

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = -80
  params.icon = "search"

[[menu.social]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/ko1vte"
  weight = 1
  params.icon = "brand-github"

[[menu.social]]
  identifier = "rss"
  name = "RSS"
  url = "/index.xml"
  weight = 2
  params.icon = "rss"
